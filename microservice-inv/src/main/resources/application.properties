spring.application.name=microservice-inv

# Configuración del Servidor
server.port=8000

# Configuración de PostgreSQL Local
spring.datasource.url=jdbc:postgresql://localhost:5432/microservice-inventario
spring.datasource.username=postgres
spring.datasource.password=teo123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Spring Security
spring.security.user.name=admin
spring.security.user.password=admin123_cambiame
spring.security.user.roles=ACTUATOR_ADMIN

# Configuración de Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
